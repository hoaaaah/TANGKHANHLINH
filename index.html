<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title> Đêm Trung Thu - Điều Ước Dưới Trăng</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #0f0f23, #1a1a3a);
            overflow: hidden;
            height: 100vh;
            cursor: default;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        #stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #00bfff;
            /* Deep sky blue color */
            border-radius: 50%;
            box-shadow: 0 0 4px #00bfff;
            animation: twinkle-optimized 3s infinite ease-in-out;
            will-change: opacity, transform;
        }

        @keyframes twinkle-optimized {
            0% {
                opacity: 0.3;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
            100% {
                opacity: 0.3;
                transform: scale(0.9);
            }
        }

        /* Add some stars with different twinkle speeds for variety */

        .star:nth-child(3n) {
            animation-duration: 2.5s;
            background: #1e90ff;
            /* Dodger blue */
            box-shadow: 0 0 4px #1e90ff;
        }

        .star:nth-child(5n) {
            animation-duration: 4s;
            background: #87ceeb;
            /* Sky blue */
            box-shadow: 0 0 4px #87ceeb;
        }

        .star:nth-child(7n) {
            animation-duration: 2s;
            background: #4169e1;
            /* Royal blue */
            box-shadow: 0 0 4px #4169e1;
        }

        #moon {
            position: absolute;
            top: 10%;
            right: 10%;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, #ffeb3b, #ffd54f, #ffb74d, #ff9800);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 223, 100, 0.9), 0 0 80px rgba(255, 223, 100, 0.7), 0 0 120px rgba(255, 223, 100, 0.5), 0 0 160px rgba(255, 223, 100, 0.3);
            z-index: 2;
            border: 2px solid rgba(255, 223, 100, 0.4);
            animation: moonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes moonGlow {
            0% {
                box-shadow: 0 0 40px rgba(255, 223, 100, 0.9), 0 0 80px rgba(255, 223, 100, 0.7), 0 0 120px rgba(255, 223, 100, 0.5), 0 0 160px rgba(255, 223, 100, 0.3);
            }
            100% {
                box-shadow: 0 0 50px rgba(255, 223, 100, 1), 0 0 100px rgba(255, 223, 100, 0.8), 0 0 150px rgba(255, 223, 100, 0.6), 0 0 200px rgba(255, 223, 100, 0.4);
            }
        }

        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            color: white;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.3);
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            max-height: 85vh;
            max-width: 80vw;
            overflow-y: auto;
            line-height: 1.4;
            min-width: 280px;
        }

        @media (max-width: 768px) {
            .popup {
                padding: 35px 25px 25px 25px;
                font-size: 20px;
                max-height: 80vh;
                max-width: 90vw;
                border-radius: 18px;
                margin: 20px;
            }
            .close-popup {
                top: 12px;
                right: 12px;
                width: 36px;
                height: 36px;
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .popup {
                padding: 40px 20px 25px 20px;
                font-size: 18px;
                max-height: 85vh;
                max-width: 95vw;
                border-radius: 15px;
                margin: 15px;
                line-height: 1.5;
            }
            .close-popup {
                top: 10px;
                right: 10px;
                width: 38px;
                height: 38px;
                font-size: 24px;
            }
        }

        @media (max-width: 360px) {
            .popup {
                padding: 45px 18px 25px 18px;
                font-size: 16px;
                max-height: 90vh;
                max-width: 98vw;
                border-radius: 12px;
                margin: 10px;
                line-height: 1.6;
            }
            .close-popup {
                top: 8px;
                right: 8px;
                width: 40px;
                height: 40px;
                font-size: 26px;
            }
        }

        .popup.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .popup::before {
            content: '💕';
            display: block;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .close-popup {
            position: absolute;
            top: 8px;
            right: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.8;
            transition: all 0.3s ease;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
            z-index: 1001;
        }

        .close-popup:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.5);
            transform: scale(1.1);
        }

        .close-popup:active {
            transform: scale(0.95);
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 5;
        }

        /* Shooting Stars CSS */

        @keyframes shooting-star-opacity {
            0% {
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
            60% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @keyframes shooting-star-pos {
            0% {
                transform: scale(0) rotate(0) translate3d(0, 0, 0);
            }
            100% {
                transform: scale(1) rotate(0) translate3d(-450px, 450px, 0);
            }
        }

        .shooting-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .shooting-star {
            display: block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            transform-origin: 100% 0;
            animation: shooting-star-opacity 6s infinite ease-in, shooting-star-pos 6s infinite ease-in;
            box-shadow: 0 0 8px 3px rgba(255, 255, 255, 0.4);
            opacity: 0;
        }

        .shooting-star:after {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            left: 3px;
            border: 0 solid #fff;
            border-width: 0 80px 1.5px;
            border-color: transparent transparent transparent rgba(255, 255, 255, 0.4);
            transform: rotate(-45deg) translate3d(1px, 2px, 0);
            box-shadow: 0 0 2px 0 rgba(255, 255, 255, 0.2);
            transform-origin: 0% 100%;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="stars"></div>
        <div class="shooting-stars" id="shooting-stars"></div>
        <div id="moon"></div>
        <div id="three-container"></div>
        <div class="loading" id="loading">Đang tải...</div>
    </div>

    <div class="popup" id="popup">
        <button class="close-popup" onclick="closePopup()" aria-label="Đóng popup">&times;</button> Anh Yêu Em ❤️
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>

<!-- Background Music -->
<audio id="backgroundMusic" loop preload="auto">
    <source src="tienne.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const urlParams = new URLSearchParams(window.location.search);
        const customMusic = urlParams.get('music') || urlParams.get('c') ?
            (function () {
                const encodedContent = urlParams.get("c");
                if (encodedContent) {
                    try {
                        const base64 = encodedContent.replace(/-/g, "+").replace(/_/g, "/");
                        const decodedString = decodeURIComponent(escape(atob(base64)));
                        const content = JSON.parse(decodedString);
                        return content.music;
                    } catch (e) {
                        return null;
                    }
                }
                return urlParams.get('music');
            })() : null;

        const audio = document.getElementById('backgroundMusic');

        if (customMusic) {
            audio.src = customMusic;
            audio.load();
        }

        // Chỉ phát khi chạm màn hình
        const startMusic = () => {
            audio.play().catch(err => console.log("Không phát được:", err));
            document.removeEventListener('click', startMusic);
            document.removeEventListener('touchstart', startMusic);
        };

        document.addEventListener('click', startMusic);
        document.addEventListener('touchstart', startMusic);
    });
</script>

</body>

</html>
